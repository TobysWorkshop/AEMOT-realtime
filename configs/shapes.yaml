input_folder_path: "../data/shapes/08/"
input_data_name: "shapes" 
ref_image_ts_path: ""
process_ts_start: -1
process_ts_end: -1
event_num_start: 93901
event_num_end: 7879601
width: 241
height: 181
n_target: 6 # Default number of tracking target
data_format: 1 # 0: ts,c,r,p; 1: c,r,p,ts
ring_buffer_len: 10
dist_threshold: 10
publish_framerate: 40
contrast_threshold : 0.1
alpha: 50
m : 2 # Number of measurements
dt: 0.0001
n_state: 10 # Number of filter state


# Flags
use_gyro_flag: 1
save_video_flag: 0
save_image_flag: 0
save_track_flag: 0
disp_covariance_flag: 0
compute_TTC_flag: 0
print_TTC_flag: 0
select_target_flag: 0 # Track pre-defined target or select by click 
ref_image_ts_flag: 0


# Kalman filter
var_x: 30
var_y: 30   
var_vx: 800
var_vy: 800
var_lambda_1: 5
var_lambda_2: 5
var_theta: 0.5
var_q: 2
q_x: 500
q_y: 500
q_vx: 5000
q_vy: 5000
q_lambda_1: 0.01
q_lambda_2: 0.01
q_theta: 0.005
q_q: 0.01
position_x_init: [82, 55, 71, 126, 148, 133]
position_y_init: [65, 82, 103, 118, 105, 68]
lambda_init: 30



# # comms
# # comms_range: 10
# decoder_thresh_on: 6
# decoder_thresh_off: -6 
# peak_thresh: 3.0
# peak_win_size: 40
# alpha_decoding: 8379 # (3334 / 2.5) * 2 * pi 
# base_frequency: 3334 # 10000 / 3.0

flag_save_DI: 0
flag_save_G: 0



# Detector
f_show_candidates             : 0

SAE_ksize                     : 7
SAE_alpha                     : 5
SAE_operation_rate            : 500 # how many events between each operation
SAE_detection_threshold       : 0.9 # val = cos(theta)
SAE_min_active_pixels         : 30
SAE_min_contributions         : 30
SAE_min_detections_in_patch   : 40
MAX_NUMBER_OF_TRACKS          : 100


detector_dist_threshold       : 40        # distance from existing track to allow detection
detector_dt_threshold         : 0.000500  # maximum dt in sae patch around new event to detect led. 

# Evaluation parameters
f_evaluate                    : 0
evaluate_ts_age               : 0.005      # how long to wait before evaluating (let it get some events)
evaluate_dt_terminate         : 0.025     # time with no events before deleting 
evaluate_low_activity_factor  : 0.25      # factor of event rate threshold to delete track
event_rate_threshold          : 1500000   # event rate required for validation
